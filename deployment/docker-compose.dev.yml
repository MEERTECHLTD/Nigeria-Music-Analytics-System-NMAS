# Docker Compose for local development (PostgreSQL only)
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nmas-db-dev
    environment:
      POSTGRES_USER: nmas
      POSTGRES_PASSWORD: nmas_dev
      POSTGRES_DB: nmas_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
